<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog Increíble</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Mi Blog Increíble</h1>
            <nav id="user-status">
                <!-- El estado del usuario se actualizará aquí con JavaScript -->
                <p>Cargando estado del usuario...</p> 
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="container">
            <section id="auth-section">
                <h2>Iniciar Sesión o Registrarse</h2>
                <div id="login-form-container">
                    <h3>Iniciar Sesión</h3>
                    <form id="login-form">
                        <div>
                            <label for="login-username">Nombre de usuario:</label>
                            <input type="text" id="login-username" name="username" required>
                        </div>
                        <div>
                            <label for="login-password">Contraseña:</label>
                            <input type="password" id="login-password" name="password" required>
                        </div>
                        <button type="submit">Iniciar Sesión</button>
                    </form>
                </div>

                <div id="register-form-container">
                    <h3>Registrarse</h3>
                    <form id="register-form">
                        <div>
                            <label for="register-username">Nombre de usuario:</label>
                            <input type="text" id="register-username" name="username" required>
                        </div>
                        <div>
                            <label for="register-password">Contraseña:</label>
                            <input type="password" id="register-password" name="password" required>
                        </div>
                        <button type="submit">Registrarse</button>
                    </form>
                </div>
            </section>

            <section id="posts-section" style="display: none;">
                <h2>Publicaciones del Blog</h2>
                <div id="posts-list">
                    <!-- Las publicaciones del blog se cargarán aquí -->
                    <p>No hay publicaciones aún. O cargando publicaciones...</p>
                </div>
                <div id="create-post-form-container" style="display: none;">
                    <h3>Crear Nueva Publicación</h3>
                    <form id="create-post-form">
                        <div>
                            <label for="post-title">Título:</label>
                            <input type="text" id="post-title" name="title" required>
                        </div>
                        <div>
                            <label for="post-content">Contenido:</label>
                            <textarea id="post-content" name="content" rows="5" required></textarea>
                        </div>
                        <button type="submit">Crear Publicación</button>
                    </form>
                </div>
            </section>

            <section id="user-actions" style="display: none;">
                <button id="logout-button">Cerrar Sesión</button>
                <button id="show-create-post-form-button">Crear Nueva Publicación</button>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Mi Blog Increíble</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
