<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>My Awesome Blog</h1>
            <nav id="user-status">
                <!-- User status will be updated here by JavaScript -->
                <p>Loading user status...</p> 
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="container">
            <section id="auth-section">
                <h2>Login or Register</h2>
                <div id="login-form-container">
                <h3>Login</h3>
                <form id="login-form">
                    <div>
                        <label for="login-username">Username:</label>
                        <input type="text" id="login-username" name="username" required>
                    </div>
                    <div>
                        <label for="login-password">Password:</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            </div>

            <div id="register-form-container">
                <h3>Register</h3>
                <form id="register-form">
                    <div>
                        <label for="register-username">Username:</label>
                        <input type="text" id="register-username" name="username" required>
                    </div>
                    <div>
                        <label for="register-password">Password:</label>
                        <input type="password" id="register-password" name="password" required>
                    </div>
                    <button type="submit">Register</button>
                </form>
            </div>
        </section>

        <section id="posts-section" style="display: none;">
            <h2>Blog Posts</h2>
            <div id="posts-list">
                <!-- Blog posts will be loaded here -->
                <p>No posts yet. Or loading posts...</p>
            </div>
            <div id="create-post-form-container" style="display: none;">
                <h3>Create New Post</h3>
                <form id="create-post-form">
                    <div>
                        <label for="post-title">Title:</label>
                        <input type="text" id="post-title" name="title" required>
                    </div>
                    <div>
                        <label for="post-content">Content:</label>
                        <textarea id="post-content" name="content" rows="5" required></textarea>
                    </div>
                    <button type="submit">Create Post</button>
                </form>
            </div>
        </section>

        <section id="user-actions" style="display: none;">
            <button id="logout-button">Logout</button>
            <button id="show-create-post-form-button">Create New Post</button>
            </section>

            <section id="posts-section" style="display: none;">
                <h2>Blog Posts</h2>
                <div id="posts-list">
                    <!-- Blog posts will be loaded here -->
                    <p>No posts yet. Or loading posts...</p>
                </div>
                <div id="create-post-form-container" style="display: none;">
                    <h3>Create New Post</h3>
                    <form id="create-post-form">
                        <div>
                            <label for="post-title">Title:</label>
                            <input type="text" id="post-title" name="title" required>
                        </div>
                        <div>
                            <label for="post-content">Content:</label>
                            <textarea id="post-content" name="content" rows="5" required></textarea>
                        </div>
                        <button type="submit">Create Post</button>
                    </form>
                </div>
            </section>

            <section id="user-actions" style="display: none;">
                <button id="logout-button">Logout</button>
                <button id="show-create-post-form-button">Create New Post</button>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 My Awesome Blog</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
